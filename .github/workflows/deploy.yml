name: Deploy Azanna Evaluator to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify quantitative engine
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build PWA
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://zzynqlqnzdhkffvqvpzt.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_x5Li82tQRPoiKP55IrNlvA_mNypDvDz

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
